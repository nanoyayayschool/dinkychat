<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinky Chat — Web Edition</title>
<style>
:root{
  --bg:#0f0f17;--panel:#11111b;--surface:#181825;--input:#1e1e2e;
  --hover:#313244;--purple:#cba6f7;--blue:#89b4fa;--green:#a6e3a1;
  --red:#f38ba8;--orange:#fab387;--text:#cdd6f4;--sub:#a6adc8;
  --font:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  --border:#ffffff1a;--shadow:#00000088;--msg:#00000033;--reply:#2b2d31;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}
.hidden{display:none!important}
button{cursor:pointer}
#auth-screen{height:100vh;display:flex;align-items:center;justify-content:center}
.auth-card{width:360px;background:var(--surface);padding:30px;border-radius:12px;box-shadow:0 8px 24px var(--shadow)}
.auth-card h1{text-align:center;color:var(--purple);font-size:24px}
.auth-card p{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 20px}
.form-group{margin-bottom:12px}.form-group label{display:block;font-size:12px;font-weight:700;color:#bac2de;margin-bottom:4px}
.form-group input{width:100%;padding:10px;background:var(--input);border:1px solid transparent;border-radius:6px;color:var(--text);outline:0}
.form-group input:focus{border-color:var(--purple)}
.checkbox{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:15px}
.btn{width:100%;padding:10px;border:0;border-radius:6px;font-weight:700;margin-bottom:8px}
.primary{background:var(--purple);color:#11111b}.secondary{background:var(--panel);color:var(--text)}
#error{height:16px;color:var(--red);font-size:12px;margin-bottom:10px}
#app{display:flex;width:100vw;height:100vh}
.sidebar{width:250px;min-width:250px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.search{padding:10px}.search input{width:100%;padding:7px 10px;background:var(--input);border:0;border-radius:4px;color:var(--text);outline:0}
.scroll{flex:1;overflow:auto;padding:0 8px}.section{font-size:11px;font-weight:700;color:var(--purple);padding:8px 4px 4px;text-transform:uppercase}
.nav{width:100%;border:0;border-radius:4px;background:transparent;color:var(--text);text-align:left;padding:8px 10px;font-size:13px;margin-bottom:2px}
.nav:hover,.nav.active{background:var(--hover)}.nav.sub{padding-left:24px;font-size:12px;color:var(--sub)}
.server-head{font-weight:700;font-size:12px;color:var(--purple);padding:4px 6px}
.server-tools{display:flex;gap:4px;margin-bottom:6px}.small{padding:6px;border:0;border-radius:4px;font-size:11px;font-weight:700}
.sidebar-actions{padding:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg),var(--surface))}
.header{padding:12px 16px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.header-title{font-weight:700;color:var(--purple);font-size:16px}.header-status{font-size:11px;color:var(--sub);margin-left:10px}.actions{display:flex;gap:6px}
.messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{background:var(--msg);padding:7px 10px;border-radius:6px}.msg.ping{background:#3e2d54;border:1px solid var(--purple)}
.author{font-weight:700;font-size:14px;cursor:pointer}.msgtext{font-size:14px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.reply-preview{font-size:11px;color:var(--sub);border-left:2px solid var(--blue);padding-left:6px;margin-bottom:4px;font-style:italic}
.replybar{background:var(--reply);padding:6px 12px;font-size:12px;color:#b9bbbe;display:flex;justify-content:space-between}.file-card{margin-top:7px;max-width:min(520px,100%);background:var(--input);border:1px solid var(--border);border-radius:7px;padding:7px}.file-image{display:block;max-width:100%;max-height:320px;border-radius:5px;cursor:pointer}.file-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;font-size:12px}.file-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inputbar{padding:12px 16px;background:var(--surface);display:flex;gap:8px;position:relative}.file-btn{min-width:40px;font-size:16px}.file-info{font-size:11px;color:var(--sub);position:absolute;left:16px;bottom:2px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inputbar textarea{flex:1;padding:10px;background:var(--input);border:0;border-radius:6px;color:var(--text);outline:0;resize:none;min-height:40px;max-height:120px;line-height:20px}
.member{width:180px;min-width:180px;background:var(--panel);border-left:1px solid var(--border);padding:12px;overflow:auto}
.member .section{padding-left:0}
.emoji{position:absolute;bottom:60px;left:16px;background:var(--surface);border:1px solid var(--hover);border-radius:8px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;box-shadow:0 4px 12px var(--shadow)}
.modal-overlay{position:fixed;inset:0;background:var(--shadow);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{width:420px;max-width:92vw;max-height:85vh;overflow:auto;background:var(--panel);padding:20px;border-radius:8px}
.modal h2,.modal h3{color:var(--purple);margin-bottom:12px}
.modal input,.modal textarea{width:100%;background:var(--input);border:0;color:var(--text);padding:9px;border-radius:5px;outline:0;margin:4px 0 10px}
.modal textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:6px}.row>*{flex:1}
.card{background:var(--input);padding:9px;border-radius:5px;margin:5px 0;display:flex;align-items:center;justify-content:space-between}
.profile-banner{height:55px;border-radius:5px;margin-bottom:10px}
.status{color:var(--green);font-size:12px;margin-bottom:10px}
.bio{background:var(--input);padding:9px;border-radius:5px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
hr{border:0;border-top:1px solid var(--border);margin:12px 0}
@media(max-width:800px){.member{display:none}.sidebar{width:210px;min-width:210px}}

/* free custom themes */
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.theme-card{border:2px solid transparent;background:var(--input);color:var(--text);border-radius:8px;padding:9px;text-align:left;cursor:pointer;transition:.15s}
.theme-card:hover{border-color:var(--purple);transform:translateY(-1px)}
.theme-card.active{border-color:var(--purple);box-shadow:0 0 0 2px #cba6f733}
.theme-swatch{height:30px;border-radius:5px;margin-bottom:7px;display:flex;overflow:hidden}
.theme-swatch span{flex:1}
.theme-name{font-size:12px;font-weight:700}
.custom-theme-box{background:var(--input);padding:10px;border-radius:7px;margin-top:8px}
.color-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-field label{display:block;font-size:10px;color:var(--sub);margin-bottom:3px}
.color-field input[type=color]{width:100%;height:34px;border:0;border-radius:5px;background:transparent;padding:0;cursor:pointer}
.theme-note{font-size:11px;color:var(--sub);line-height:1.4;margin:4px 0 10px}

/* mobile + customization extras */
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800;color:#111;background:var(--blue)}
.avatar.small-avatar{width:28px;height:28px;font-size:11px}.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:4px solid var(--surface);margin-top:-38px;background:var(--blue)}
.server-icon{width:28px;height:28px;border-radius:9px;object-fit:cover;vertical-align:middle;background:var(--hover);margin-right:6px}.server-banner{height:130px;border-radius:10px 10px 0 0;background:linear-gradient(135deg,var(--accent,var(--purple)),var(--surface));background-size:cover;background-position:center}.server-custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.server-custom-grid .full{grid-column:1/-1}.theme-dropdown{position:relative}.theme-dropdown summary{list-style:none;cursor:pointer}.theme-dropdown summary::-webkit-details-marker{display:none}.theme-menu{position:absolute;bottom:42px;left:0;width:210px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;box-shadow:0 12px 30px var(--shadow);z-index:1000}.theme-menu button{width:100%;text-align:left;margin:2px 0}.mobile-only{display:none}
@media (max-width:800px){
  #app{grid-template-columns:1fr!important;position:relative;overflow:hidden}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(88vw,330px);z-index:900;transform:translateX(-105%);transition:transform .2s ease;box-shadow:10px 0 30px #0008}
  .sidebar.mobile-open{transform:translateX(0)}
  .member{position:fixed;right:0;top:0;bottom:0;width:min(82vw,300px);z-index:890;transform:translateX(105%);transition:transform .2s ease;box-shadow:-10px 0 30px #0008}
  .member.mobile-open{transform:translateX(0)}
  .chat{min-width:0;width:100vw}.header{padding:8px 10px}.header-title{max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.header-actions,.actions{gap:4px}.actions .small{padding:7px 8px}.mobile-only{display:inline-flex!important}
  .inputbar{padding:7px;gap:5px}.inputbar textarea{min-width:0;font-size:15px}.file-btn{padding:8px!important}.inputbar .primary{padding:0 10px!important}
  .messages{padding:10px 8px}.msg{padding:8px 7px}.modal{width:calc(100vw - 20px);max-height:88vh;overflow:auto}.server-custom-grid{grid-template-columns:1fr}.theme-menu{bottom:auto;top:42px;left:auto;right:0}.server-tools{flex-wrap:wrap}.server-tools .small{min-width:0}
}
@media (max-width:420px){.header-status{display:none}.actions .small{font-size:11px}.msgtext{font-size:14px}.auth-card{width:calc(100vw - 24px)}.theme-grid{grid-template-columns:repeat(2,1fr)!important}}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <h1>DINKY CHAT</h1><p>Sign in to start chatting</p>
    <div id="error"></div>
    <div class="form-group"><label>Username</label><input id="user"></div>
    <div class="form-group"><label>Password</label><input id="pass" type="password"></div>
    <label class="checkbox"><input id="auto" type="checkbox" checked> Auto Login on Startup</label>
    <button class="btn primary" onclick="login()">Log In</button>
    <button class="btn secondary" onclick="register()">Create Account</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="search"><input id="search" placeholder="Search..." oninput="renderSidebar()"></div>
    <div class="scroll">
      <div class="section">⚡ Channels</div>
      <button class="nav" onclick="switchChannel('global')"># global-chat</button>
      <button class="nav" style="color:var(--green)" onclick="friendsTab()">👥 Friends Tab</button>
      <div class="section">🏠 Servers</div>
      <div class="server-tools">
        <button class="small primary" style="flex:1" onclick="createServer()">+ Create</button>
        <button class="small" style="flex:1;background:var(--blue);color:#111" onclick="discover()">🔍 Discover</button>
      </div>
      <div id="servers"></div>
      <div class="section" style="display:flex;justify-content:space-between;align-items:center">
        <span>💬 Direct Messages</span><button id="reqs" class="small" style="background:var(--hover);color:var(--green)" onclick="requests()">Requests (0)</button>
      </div>
      <div id="friends"></div>
    </div>
    <div class="sidebar-actions">
      <button class="small" style="background:var(--green);color:#111" onclick="addFriend()">+ Add Friend</button>
      <details class="theme-dropdown"><summary class="small" style="background:var(--hover);color:var(--text)">🎨 Themes ▾</summary><div class="theme-menu"><button class="small" onclick="quickTheme('dinky')">🌙 Dinky</button><button class="small" onclick="quickTheme('ocean')">🌊 Ocean</button><button class="small" onclick="quickTheme('forest')">🌲 Forest</button><button class="small" onclick="quickTheme('sunset')">🌅 Sunset</button><button class="small" onclick="quickTheme('lavender')">💜 Lavender</button><button class="small" onclick="quickTheme('mono')">⚪ Mono</button><button class="small primary" onclick="settings();this.closest('details').open=false">🎨 More themes & custom</button></div></details>
      <button class="small" style="background:var(--red);color:#111" onclick="logout()">🚪 Log Out</button>
    </div>
  </aside>
  <main class="chat">
    <header class="header"><div style="display:flex;align-items:center;gap:7px"><button class="small mobile-only" style="background:var(--hover);color:var(--text)" onclick="toggleMobileSidebar()">☰</button><span id="header" class="header-title"># global-chat</span><span id="conn" class="header-status">● connecting...</span></div><div style="display:flex;align-items:center;gap:5px"><div id="actions" class="actions"></div><button class="small mobile-only" style="background:var(--hover);color:var(--text)" onclick="toggleMobileMembers()">👥</button></div></header>
    <div id="messages" class="messages"></div>
    <div id="replybar" class="replybar hidden"><span id="replytext"></span><b style="color:var(--red);cursor:pointer" onclick="cancelReply()">✕</b></div>
    <div class="inputbar">
      <button class="small file-btn" title="Attach a file" style="background:var(--hover);color:var(--text)" onclick="pickFile()">📎</button>
      <input id="fileInput" type="file" class="hidden" onchange="handleFilePick(event)">
      <button class="small" style="background:var(--hover);color:var(--text)" onclick="toggleEmoji()">:-)</button>
      <div id="emoji" class="emoji hidden"></div>
      <textarea id="message" rows="1" placeholder="Message..." onkeydown="messageKeydown(event)" oninput="autoGrow(this)"></textarea>
      <button class="small primary" style="padding:0 16px" onclick="send()">Send</button>
      <div id="fileInfo" class="file-info hidden"></div>
    </div>
  </main>
  <aside id="member" class="member hidden"><div class="section">MEMBERS</div><div id="members"></div></aside>
</div>
<div id="overlay" class="modal-overlay hidden" onclick="closeModal(event)"><div id="modal" class="modal" onclick="event.stopPropagation()"></div></div>

<script>
const BASE_URL="https://dinky476.pythonanywhere.com";
const EMOTICONS=[":)","XD",":P",":D","<3",">:(","B)",">:) ",":3",":(",";)","<:0",">:0","<:3",">:3","OwO","UwU"];
let session=null,currentChannel="global",currentServerId=null,replyTarget=null;
let friends=[],servers=[],requestsList=[],blocked=[],lastCount=-1,pollTimer=null;
let connected=false;
let profileCache={};
let globalMemberUsers=[];
let selectedFile=null;
let profile={status_msg:"Online",bio:"",name_color:"#CBA6F7",font_family:"Segoe UI",avatar_color:"#89B4FA",banner_color:"#313244"};

function esc(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
async function api(endpoint,data){
  try{
    const r=await fetch(`${BASE_URL}/${endpoint}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    const raw=await r.text();
    let out;
    try{out=JSON.parse(raw)}
    catch{out={status:"error",message:`Server returned HTTP ${r.status}: ${raw.slice(0,300)}`}}

    if(r.status===401 && endpoint!=="login" && endpoint!=="register"){
      handleAuthFailure();
    }else if(r.ok){
      setConnection(true);
    }else{
      setConnection(false,`HTTP ${r.status}`);
    }
    return out;
  }catch(e){
    setConnection(false,"offline");
    return {status:"error",message:"Connection error: "+e.message};
  }
}


const THEME_PRESETS={
  dinky:{name:"Dinky",colors:{bg:"#0f0f17",panel:"#11111b",surface:"#181825",input:"#1e1e2e",hover:"#313244",accent:"#cba6f7",text:"#cdd6f4",sub:"#a6adc8"}},
  ocean:{name:"Ocean",colors:{bg:"#07141f",panel:"#0b1d2a",surface:"#102838",input:"#153447",hover:"#1f4b63",accent:"#67d5ff",text:"#d9f5ff",sub:"#9bc4d4"}},
  forest:{name:"Forest",colors:{bg:"#0b160f",panel:"#0e2116",surface:"#13301d",input:"#173b24",hover:"#245734",accent:"#8be28b",text:"#e1f5e1",sub:"#a8c8a8"}},
  sunset:{name:"Sunset",colors:{bg:"#1a0d14",panel:"#24111b",surface:"#321622",input:"#401b2a",hover:"#633047",accent:"#ff9b9b",text:"#ffe5e5",sub:"#d6a9b5"}},
  lavender:{name:"Lavender",colors:{bg:"#12101c",panel:"#191526",surface:"#211c31",input:"#2b2440",hover:"#44375e",accent:"#d8b4ff",text:"#f0e8ff",sub:"#b9a9cf"}},
  mono:{name:"Mono",colors:{bg:"#101010",panel:"#171717",surface:"#202020",input:"#292929",hover:"#3a3a3a",accent:"#ffffff",text:"#f4f4f4",sub:"#aaaaaa"}}
};

function hexToRgba(hex,alpha){
  const h=hex.replace("#","");
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function applyTheme(id,save=true){
  const t=THEME_PRESETS[id];
  if(!t)return;
  const c=t.colors,r=document.documentElement.style;
  r.setProperty("--bg",c.bg);r.setProperty("--panel",c.panel);r.setProperty("--surface",c.surface);
  r.setProperty("--input",c.input);r.setProperty("--hover",c.hover);r.setProperty("--purple",c.accent);
  r.setProperty("--blue",c.accent);r.setProperty("--text",c.text);r.setProperty("--sub",c.sub);
  r.setProperty("--border",hexToRgba(c.text,.10));r.setProperty("--shadow","rgba(0,0,0,.53)");
  r.setProperty("--msg","rgba(0,0,0,.20)");r.setProperty("--reply",c.input);
  if(save)localStorage.setItem("dinky_theme",JSON.stringify({type:"preset",id}));
  renderThemeGrid(id);
}
function applyCustomTheme(){
  const ids=["themeBg","themePanel","themeSurface","themeInput","themeHover","themeAccent","themeText","themeSub"];
  const vals=ids.map(id=>$(id)?.value);
  if(vals.some(v=>!v))return;
  const c={bg:vals[0],panel:vals[1],surface:vals[2],input:vals[3],hover:vals[4],accent:vals[5],text:vals[6],sub:vals[7]};
  const r=document.documentElement.style;
  r.setProperty("--bg",c.bg);r.setProperty("--panel",c.panel);r.setProperty("--surface",c.surface);
  r.setProperty("--input",c.input);r.setProperty("--hover",c.hover);r.setProperty("--purple",c.accent);
  r.setProperty("--blue",c.accent);r.setProperty("--text",c.text);r.setProperty("--sub",c.sub);
  r.setProperty("--border",hexToRgba(c.text,.10));r.setProperty("--shadow","rgba(0,0,0,.53)");
  r.setProperty("--msg","rgba(0,0,0,.20)");r.setProperty("--reply",c.input);
  localStorage.setItem("dinky_theme",JSON.stringify({type:"custom",colors:c}));
  renderThemeGrid(null);
}
function renderThemeGrid(activeId){
  const box=$("themeGrid"); if(!box)return;
  box.innerHTML="";
  Object.entries(THEME_PRESETS).forEach(([id,t])=>{
    const c=t.colors,b=document.createElement("button");
    b.className="theme-card"+(activeId===id?" active":"");
    b.innerHTML=`<div class="theme-swatch">
      <span style="background:${c.bg}"></span><span style="background:${c.surface}"></span>
      <span style="background:${c.input}"></span><span style="background:${c.accent}"></span>
    </div><div class="theme-name">${esc(t.name)}${activeId===id?" ✓":""}</div>`;
    b.onclick=()=>applyTheme(id);
    box.appendChild(b);
  });
}
function loadTheme(){
  try{
    const saved=JSON.parse(localStorage.getItem("dinky_theme")||"null");
    if(saved?.type==="preset"&&THEME_PRESETS[saved.id]){applyTheme(saved.id,false);return}
    if(saved?.type==="custom"&&saved.colors){
      const c=saved.colors,r=document.documentElement.style;
      for(const [k,v] of Object.entries(c)){
        if(k==="accent"){r.setProperty("--purple",v);r.setProperty("--blue",v)}
        else r.setProperty("--"+k,v);
      }
      r.setProperty("--border",hexToRgba(c.text,.10));r.setProperty("--shadow","rgba(0,0,0,.53)");
      r.setProperty("--msg","rgba(0,0,0,.20)");r.setProperty("--reply",c.input);
      return;
    }
  }catch{}
}
loadTheme();

let authFailureShown=false;
function handleAuthFailure(){
  if(authFailureShown)return;
  authFailureShown=true;
  clearInterval(pollTimer);
  localStorage.removeItem("dinky_session");
  session=null;
  $("app").classList.add("hidden");
  $("auth-screen").classList.remove("hidden");
  $("error").textContent="Your Dinky Chat session expired. Please log in again.";
  setConnection(false,"HTTP 401");
}
function setConnection(ok,label){
  connected=ok;
  if($("conn")){$("conn").textContent=`● ${label|| (ok?"connected":"offline")}`;$('conn').style.color=ok?"var(--green)":"var(--red)";}
}
function autoGrow(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";}
function messageKeydown(e){
  if(e.key==="Enter" && (e.ctrlKey || !e.shiftKey)){e.preventDefault();send();}
}

function quickTheme(id){applyTheme(id);document.querySelectorAll('.theme-dropdown').forEach(d=>d.open=false)}
function toggleMobileSidebar(){document.querySelector('.sidebar')?.classList.toggle('mobile-open');document.querySelector('.member')?.classList.remove('mobile-open')}
function toggleMobileMembers(){document.querySelector('.member')?.classList.toggle('mobile-open');document.querySelector('.sidebar')?.classList.remove('mobile-open')}
function closeMobilePanels(){document.querySelector('.sidebar')?.classList.remove('mobile-open');document.querySelector('.member')?.classList.remove('mobile-open')}
function settingsData(){try{return JSON.parse(localStorage.getItem("dinky_settings")||'{"auto_login":true}')}catch{return {auto_login:true}}}
window.onload=()=>{
  setupEmoji();
  const s=localStorage.getItem("dinky_session"), st=settingsData();
  if(s&&st.auto_login){try{session=JSON.parse(s);startApp()}catch{}}
};
async function login(){
  const username=$("user").value.trim(),password=$("pass").value.trim();
  if(!username||!password)return error("Fill in all fields.");
  const r=await api("login",{username,password});
  if(r.status==="success"){
    authFailureShown=false;

async function updateGlobalMembers(msgs){

    if(Object.prototype.hasOwnProperty.call(profileCache,u))continue;
    const res=await api("get_user_profile",{
      username:session.username,token:session.token,target:u
    });
    profileCache[u]=res.status==="success"?res.profile:null;
  }
  if(currentChannel==="global")renderGlobalMembers();

function renderMessages(msgs){

  box.innerHTML="";
  msgs.forEach((m,i)=>{
    if(blocked.includes(m.sender))return;
    let text=m.text||"",reply="";
    if(text.startsWith("↳ Replying to")){
      const p=text.split("\n");reply=`<div class="reply-preview">${esc(p[0])}</div>`;text=p.slice(1).join("\n");
    }
    const div=document.createElement("div");div.className="msg"+(text.includes("@"+session.username)?" ping":"");
    const a=document.createElement("span");a.className="author";a.textContent=m.sender;a.style.color=m.name_color||"#CBA6F7";a.onclick=()=>viewProfile(m.sender);
    const head=document.createElement("div");head.appendChild(a);

function absoluteFileUrl(url){return String(url||"").startsWith("http")?url:`${BASE_URL}${url}`;}
function createFileElement(m){
  const wrap=document.createElement("div");wrap.className="file-card";

    const img=document.createElement("img");img.src=url;img.alt=name;img.className="file-image";img.loading="lazy";
    img.onclick=()=>window.open(url,"_blank");wrap.appendChild(img);
  }
  const row=document.createElement("div");row.className="file-row";
  const label=document.createElement("span");label.textContent=`📎 ${name}${m.file_size?` • ${formatBytes(m.file_size)}`:""}`;
  const link=document.createElement("a");link.href=url;link.target="_blank";link.rel="noopener";link.download=name;link.className="small primary";link.textContent="Open";

function formatBytes(n){if(!n)return "";const u=["B","KB","MB","GB"];let i=0,x=Number(n);while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x<10&&i>0?x.toFixed(1):Math.round(x)} ${u[i]}`}

async function uploadChatFile(file){
  const fd=new FormData();fd.append("username",session.username);fd.append("token",session.token);fd.append("file",file);
  try{
    const r=await fetch(`${BASE_URL}/upload_chat_file`,{method:"POST",body:fd});
    const raw=await r.text();let out;try{out=JSON.parse(raw)}catch{out={status:"error",message:`Server returned HTTP ${r.status}: ${raw.slice(0,300)}`}}
    if(r.status===401){handleAuthFailure();return {status:"error",message:"Your session expired. Please log in again."}}
    if(r.ok)setConnection(true);else setConnection(false,`HTTP ${r.status}`);
    return out;
  }catch(e){setConnection(false,"offline");return {status:"error",message:"Upload failed: "+e.message}}
}

async function send(){
  let text=$("message").value.trim();if((!text&&!selectedFile)||currentChannel==="friends_tab")return;
  const originalText=text, file=selectedFile;
  if(replyTarget&&text)text=`↳ Replying to @${replyTarget.sender}: "${replyTarget.text}"\n${text}`;
  let ch=currentChannel;if(ch!=="global"&&!ch.startsWith("server_"))ch=[session.username,currentChannel].sort().join("-");
  const sendBtn=document.querySelector('.inputbar .primary:last-of-type');
  if(sendBtn){sendBtn.disabled=true;sendBtn.textContent=file?"Uploading…":"Sending…"}
  try{
    let fileData=null;
    if(file){
      const up=await uploadChatFile(file);
      if(up.status!=="success"){alert(up.message||"File upload failed.");return}
      fileData=up;
    }
    $("message").value="";cancelReply();clearSelectedFile();
    const payload={username:session.username,token:session.token,channel:ch,text};
    if(fileData){payload.file_url=fileData.file_url;payload.file_name=fileData.file_name;payload.file_size=fileData.file_size;payload.file_type=fileData.file_type}
    const r=await api("send_message",payload);
    if(r.status==="error"){
      $("message").value=originalText;autoGrow($("message"));
      alert(r.message||"Failed to send message.");return;
    }
    poll();
  }finally{
    if(sendBtn){sendBtn.disabled=false;sendBtn.textContent="Send"}
  }
}

async function uploadServerAsset(type){
  const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/gif,image/webp';input.onchange=async()=>{if(!input.files[0])return;const fd=new FormData();fd.append('username',session.username);fd.append('token',session.token);fd.append('server_id',String(currentServerId));fd.append('asset_type',type);fd.append('file',input.files[0]);const r=await fetch(`${BASE_URL}/upload_server_asset`,{method:'POST',body:fd});const out=await r.json().catch(()=>({status:'error',message:'Upload failed'}));if(out.status==='success'){await poll();serverSettings()}else alert(out.message||'Upload failed.')};input.click();
}
async function createRole(){const name=prompt('Role name:');if(!name)return;const r=await api('create_role',{username:session.username,token:session.token,server_id:String(currentServerId),name,color:'#CBA6F7',permissions:['view','send']});if(r.status==='success')serverSettings();else alert(r.message||'Could not create role.')}
async function deleteRole(id){if(!confirm('Delete this role?'))return;const r=await api('delete_role',{username:session.username,token:session.token,server_id:String(currentServerId),role_id:String(id)});if(r.status==='success')serverSettings();else alert(r.message||'Could not delete role.')}
async function saveOnboarding(){const r=await api('update_onboarding',{username:session.username,token:session.token,server_id:String(currentServerId),enabled:$('obEnabled').checked,welcome:$('obWelcome').value,questions:[]});if(r.status==='success'){alert('Onboarding saved!');poll()}else alert(r.message||'Could not save onboarding.')}
async function deleteServer(){
  openModal(`<h2 style="color:var(--red)">Delete Server</h2><p style="margin-bottom:10px">Enter password twice to delete.</p><input id="del1" type="password" placeholder="Password"><input id="del2" type="password" placeholder="Confirm Password"><button class="btn" style="background:var(--red);color:#111" onclick="confirmDeleteServer()">Delete Server Permanently</button>`);
}
async function confirmDeleteServer(){
  const r=await api("delete_server",{username:session.username,token:session.token,server_id:currentServerId,pass1:$("del1").value,pass2:$("del2").value});
  if(r.status==="success"){alert("Server deleted.");closeModal();switchChannel("global");poll()}else alert(r.message||"Failed to delete server.");
}
async function settings(){
  const st=settingsData();
  openModal(`<h2>Style & Settings</h2>
    <label>Username Color</label><input id="nameColor" type="color" value="${profile.name_color}">
    <label>Avatar Color</label><input id="avatarColor" type="color" value="${profile.avatar_color}">
    <label>Banner Color</label><input id="bannerColor" type="color" value="${profile.banner_color}">
    <label>Font Family</label><input id="font" value="${esc(profile.font_family)}">
    <hr><h3>🎨 Themes — free</h3>
    <div class="theme-note">Pick a preset or make your own. Themes are saved on this device and don't require a paid plan.</div>
    <div id="themeGrid" class="theme-grid"></div>
    <div class="custom-theme-box">
      <b style="font-size:12px;color:var(--purple)">Custom Theme</b>
      <div class="color-row" style="margin-top:8px">
        <div class="color-field"><label>Background</label><input id="themeBg" type="color"></div>
        <div class="color-field"><label>Panel</label><input id="themePanel" type="color"></div>
        <div class="color-field"><label>Surface</label><input id="themeSurface" type="color"></div>
        <div class="color-field"><label>Input</label><input id="themeInput" type="color"></div>
        <div class="color-field"><label>Hover</label><input id="themeHover" type="color"></div>
        <div class="color-field"><label>Accent</label><input id="themeAccent" type="color"></div>
        <div class="color-field"><label>Text</label><input id="themeText" type="color"></div>
        <div class="color-field"><label>Secondary text</label><input id="themeSub" type="color"></div>
      </div>
      <button class="btn primary" style="margin-top:8px" onclick="applyCustomTheme()">Apply Custom Theme</button>
    </div>
    <hr><h3>🪪 Profile</h3><div class="row"><button class="small" onclick="uploadProfileAsset('avatar')">🖼 Upload Avatar</button><button class="small" onclick="uploadProfileAsset('banner')">🌄 Upload Banner</button></div><div class="theme-note">PNG, JPG, GIF or WEBP. Your avatar and banner are shown on your profile card.</div>
    <label>Status Preset</label><input id="status" value="${esc(profile.status_msg)}">
    <label>Bio</label><textarea id="bio">${esc(profile.bio)}</textarea>
    <button class="btn secondary" onclick="toggleProfile()">Toggle Public Profile (Discoverability)</button>
    <button class="btn secondary" onclick="copyUsername()">📋 Copy My Username</button>
    <label class="checkbox"><input id="autoSet" type="checkbox" ${st.auto_login?"checked":""}> Auto Login on Startup</label>
    <button class="btn primary" onclick="saveSettings()">Save Profile & Settings</button>`);
  setTimeout(()=>{
    const saved=JSON.parse(localStorage.getItem("dinky_theme")||"null");
    const c=saved?.type==="custom"?saved.colors:THEME_PRESETS[saved?.id||"dinky"]?.colors;
    if(c){
      $("themeBg").value=c.bg;$("themePanel").value=c.panel;$("themeSurface").value=c.surface;
      $("themeInput").value=c.input;$("themeHover").value=c.hover;$("themeAccent").value=c.accent;
      $("themeText").value=c.text;$("themeSub").value=c.sub;
    }
    renderThemeGrid(saved?.type==="preset"?saved.id:null);
  },0);
}
async function uploadProfileAsset(type){const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/gif,image/webp';input.onchange=async()=>{if(!input.files[0])return;const fd=new FormData();fd.append('username',session.username);fd.append('token',session.token);fd.append('file',input.files[0]);const endpoint=type==='avatar'?'upload_avatar':'upload_banner';const r=await fetch(`${BASE_URL}/${endpoint}`,{method:'POST',body:fd});const out=await r.json().catch(()=>({status:'error',message:'Upload failed'}));if(out.status==='success'){await loadOwnProfile();closeModal();viewProfile(session.username)}else alert(out.message||'Upload failed.')};input.click()}
async function toggleProfile(){const r=await api("toggle_profile_public",{username:session.username,token:session.token});alert(r.message||"Updated profile visibility.")}
async function copyUsername(){
  try{await navigator.clipboard.writeText(session.username);alert(`Copied @${session.username}`)}
  catch{alert(`Your username is @${session.username}`)}
}
async function saveSettings(){
  profile.name_color=$("nameColor").value;profile.avatar_color=$("avatarColor").value;profile.banner_color=$("bannerColor").value;
  profile.font_family=$("font").value.trim()||"Segoe UI";profile.status_msg=$("status").value.trim()||"Online";profile.bio=$("bio").value.trim();document.documentElement.style.setProperty("--font",profile.font_family);
  localStorage.setItem("dinky_settings",JSON.stringify({auto_login:$("autoSet").checked}));
  await api("update_profile",{username:session.username,token:session.token,status:profile.status_msg,bio:profile.bio,name_color:profile.name_color,avatar_color:profile.avatar_color,banner_color:profile.banner_color,font_family:profile.font_family});
  closeModal();poll();
}
async function viewProfile(target){
  const r=await api("get_user_profile",{username:session.username,token:session.token,target});
  if(r.status!=="success")return alert("Could not fetch profile.");
  const p=r.profile||{};const avatar=p.avatar_url?`<img class="profile-avatar" src="${absoluteFileUrl(p.avatar_url)}">`:`<div class="profile-avatar" style="display:flex;align-items:center;justify-content:center;background:${esc(p.avatar_color||'#89B4FA')};color:#111;font-size:28px;font-weight:900">${esc((p.username||'?')[0]).toUpperCase()}</div>`;
  openModal(`<div class="profile-banner" style="background:${p.banner_url?`url(${absoluteFileUrl(p.banner_url)}) center/cover`:esc(p.banner_color||"#313244")}"></div><div style="padding:0 12px 12px">${avatar}<h2 style="color:${esc(p.name_color||"#CBA6F7")}">@${esc(p.username)}</h2><div class="status">${esc(p.status||"Offline")}</div><div class="bio">${esc(p.bio||"No bio provided.")}</div>${target!==session.username?`<div class="row"><button class="small" style="background:var(--orange);color:#111" onclick="unfriend('${esc(target)}')">Unfriend</button><button class="small" style="background:var(--red);color:#111" onclick="block('${esc(target)}')">Block</button></div>`:`<button class="small primary" onclick="settings();">Edit Profile</button>`}</div>`);
}
async function unfriend(u){await api("unfriend_user",{username:session.username,token:session.token,target:u});alert(`Removed @${u} from friends.`);closeModal();poll()}
async function block(u){await api("block_user",{username:session.username,token:session.token,target:u});alert(`Blocked @${u}.`);closeModal();poll()}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.querySelectorAll(".popup").forEach(x=>x.remove());
    if(!$('overlay').classList.contains('hidden'))closeModal();
    if(replyTarget)cancelReply();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();
    if(!$('app').classList.contains('hidden')){$('search').focus();$('search').select();}
  }
});
</script>
